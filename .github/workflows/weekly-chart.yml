# 237 Charts — weekly chart, fully automatic.
# Every Monday 07:00 UTC (08:00 WAT): collect data, build the charts, update the website,
# and save the week's data back to this repository (the repository is the archive).
# Can also be started by hand: GitHub → Actions → "Weekly chart" → Run workflow.
name: Weekly chart

on:
  schedule:
    - cron: "0 7 * * 1"
  # Admin edits (dashboard or github.com) do NOT start a run: they apply at the Monday run,
  # or right away with "Re-run now" in the admin (Actions → Weekly chart → Run workflow).
  # One run per batch of decisions saves YouTube quota and GitHub minutes.
  push:
    branches: [main]
    # code changes only (the bot's own data commits never trigger a run)
    paths: ["collector/**/*.mjs", "web/app/**", ".github/workflows/weekly-chart.yml"]
  workflow_dispatch:
    inputs:
      dry:
        description: "Preview only (no official chart)"
        type: boolean
        default: false

permissions:
  contents: write   # to commit the week's data

concurrency:
  group: weekly-chart
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install website dependencies
        run: npm ci --prefix web --no-audit --no-fund

      - name: Run the week
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # The secret was saved as CLOUDFLARE_API_TOKE (typo); accept either name
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_URL: ${{ vars.SITE_URL || 'https://237charts.pages.dev' }}
        # Output is also saved to collector/out/last-run.log (committed below) so failures are readable by anyone
        shell: bash
        run: |
          set -o pipefail
          node collector/run-week.mjs ${{ inputs.dry && '--dry' || '' }} 2>&1 | tee collector/out/last-run.log

      - name: Save this week's data to the repository
        if: always()
        run: |
          git config user.name "237 Charts bot"
          git config user.email "actions@users.noreply.github.com"
          git add collector/out admin web/data
          git diff --cached --quiet || git commit -m "Weekly run $(date -u +%Y-%m-%d)"
          # Someone may have pushed (e.g. an admin save) while this run was going: rebase onto it, retry a few times
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin main || { git rebase --abort; git pull --no-rebase -X ours origin main; }
          done
          exit 1
