<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add artist</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#03100A;color-scheme:dark}
a{color:#A6E3B3}a:hover{color:#A6E3B3}
.btn{font:inherit;font-size:14px;font-weight:600;border-radius:10px;padding:10px 16px;min-height:44px;border:1px solid #2E5040;background:#0A1E13;color:#F2FBF5;cursor:pointer}
.btn.pri{background:#A6E3B3;border-color:#A6E3B3;color:#03100A}
.sg{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid #1A3224;font-size:14px}
.av{width:36px;height:36px;border-radius:50%;background:#1C3A29;color:#A6E3B3;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
input,select,textarea{font:inherit;font-size:14px;font-weight:400;border:1px solid #2E5040;border-radius:10px;padding:10px 12px;min-height:44px;box-sizing:border-box;width:100%;background:#0A1E13;color:#F2FBF5}
</style>
</helmet>
<div style="min-height: 1000px; background: #010805; font-family: Inter, system-ui, sans-serif; color: #F2FBF5; display: flex; align-items: center; justify-content: center; padding: 32px; box-sizing: border-box">
<section role="dialog" aria-modal="true" aria-labelledby="at" style="width: 100%; max-width: 600px; background: #0A1E13; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 24px 60px rgba(0,0,0,.65)">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px"><h2 id="at" style="margin: 0; font-size: 22px; font-weight: 800">Add artist</h2><button class="btn" aria-label="Close" style="width: 44px; padding: 0">×</button></div>
<label class="f">Artist name<input value="Kocey"></label>
<div style="border: 1px solid #5A3A18; background: #2A1C0E; border-radius: 12px; overflow: hidden">
<div style="padding: 12px 14px; font-size: 14px; font-weight: 600; color: #FFB86B">Did you mean an existing artist?</div>
<div class="sg"><span class="av">K</span><span style="flex: 1"><strong>Kocee</strong><div style="color: #9DB3A5">Afro · 3 songs charting · Cameroonian</div></span><button class="btn">Add “Kocey” as alias</button></div>
<div class="sg"><span class="av">K</span><span style="flex: 1"><strong>Koko Ateba</strong><div style="color: #9DB3A5">Bikutsi · not charting</div></span><button class="btn">Open</button></div>
</div>
<div style="font-size: 13px; color: #9DB3A5; text-align: center">— or, if this really is a new artist —</div>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
<label class="f">Genre<select><option>Pick a genre…</option><option>Makossa</option><option>Bikutsi</option><option>Afro</option></select></label>
<label class="f">YouTube channel (optional)<input placeholder="Paste a link"></label>
</div>
<label class="f">Nationality evidence (required)<input placeholder="Link or note showing the artist is Cameroonian"></label>
<label class="f">Reason (required, public)<input placeholder="Why add this artist?"></label>
<div style="display: flex; justify-content: flex-end; gap: 10px"><button class="btn">Cancel</button><button class="btn pri">Add new artist</button></div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
