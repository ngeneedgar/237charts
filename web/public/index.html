<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>237 Charts</title>
<script>
  // Send visitors to their language: English browsers → /en/, everyone else → /fr/
  var l = (navigator.language || "fr").toLowerCase();
  location.replace(l.indexOf("en") === 0 ? "/en/" : "/fr/");
</script>
<meta http-equiv="refresh" content="1; url=/fr/">
</head>
<body><a href="/fr/">Français</a> · <a href="/en/">English</a></body>
</html>
