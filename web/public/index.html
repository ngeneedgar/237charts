<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>237 Charts</title>
<script>
  // Language: the one saved in Settings; otherwise English browsers → /en/, everyone else → /fr/
  var l = "";
  try { l = (JSON.parse(localStorage.getItem("237prefs") || "{}").lang) || ""; } catch (e) {}
  if (l !== "fr" && l !== "en") l = (navigator.language || "fr").toLowerCase().indexOf("en") === 0 ? "en" : "fr";
  location.replace("/" + l + "/");
</script>
<meta http-equiv="refresh" content="1; url=/fr/">
</head>
<body><a href="/fr/">Français</a> · <a href="/en/">English</a></body>
</html>
