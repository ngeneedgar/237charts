        'subhead': ['15px', { lineHeight: '20px', letterSpacing: '-0.24px', fontWeight: '400' }],
        'subhead-semibold': ['15px', { lineHeight: '20px', letterSpacing: '-0.24px', fontWeight: '600' }],
        'footnote': ['13px', { lineHeight: '18px', letterSpacing: '-0.08px', fontWeight: '400' }],
        'footnote-semibold': ['13px', { lineHeight: '18px', letterSpacing: '-0.08px', fontWeight: '600' }],
        'caption': ['12px', { lineHeight: '16px', letterSpacing: '0px', fontWeight: '400' }],
        'tab-label': ['10px', { lineHeight: '12px', letterSpacing: '0.1px', fontWeight: '500' }],
      },
      transitionDuration: {
        'spring': '250ms',
        'release': '200ms',
      },
      transitionDelay: {

        'release': '0ms',
      },
      transitionTimingFunction: {
        'spring': 'cubic-bezier(0.25, 0.1, 0.25, 1)',
        'release': 'cubic-bezier(0.25, 0.1, 0.25, 1)',
      },

if (typeof module !== 'undefined') module.exports = globalThis.tailwind.config;
</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet">
  <style>
    html, body { font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
    .art-1 { background: linear-gradient(135deg, #FF9F43, #EE5A24); }
    .art-2 { background: linear-gradient(135deg, #5F27CD, #341F97); }
    .art-3 { background: linear-gradient(135deg, #10AC84, #01695A); }
    .art-4 { background: linear-gradient(135deg, #FF6B81, #C44569); }
    .art-5 { background: linear-gradient(135deg, #48DBFB, #0A79DF); }
    .art-6 { background: linear-gradient(135deg, #FECA57, #E1A100); }
    .art-7 { background: linear-gradient(135deg, #A29BFE, #6C5CE7); }
    .art-8 { background: linear-gradient(135deg, #576574, #222F3E); }
    .art-9 { background: linear-gradient(135deg, #FF9FF3, #B53471); }
    .art-10 { background: linear-gradient(135deg, #1DD1A1, #0E7C61); }
  </style>
</head>
<body class="bg-light-background dark:bg-dark-background text-light-on-surface dark:text-dark-on-surface font-body">

  <div class="min-h-[884px] flex flex-col bg-light-background dark:bg-dark-background text-light-on-surface dark:text-dark-on-surface pb-24" data-stitch-vh="min-h-[884px]===min-h-screen">

    <!-- Sticky Navigation Bar -->
    <header class="sticky top-0 z-10 bg-light-background/80 dark:bg-dark-background/80 backdrop-blur-xl">
      <div class="max-w-2xl mx-auto px-lg h-11 flex items-center justify-between">
        <a href="#home" class="inline-flex items-center gap-xs text-light-accent dark:text-dark-accent font-body text-body">
          <svg class="w-3 h-5" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2 2 10l8 8"></path></svg>
          <span data-design-text-token="body">Charts</span>
        </a>
        <div data-component-id="tabs-horizontal" data-component-type="tabs" data-component-variant="horizontal" class="inline-flex bg-light-surface-container-high dark:bg-dark-surface-container-high rounded-list p-0.5" role="group" aria-label="Language">
          <button type="button" id="btn-en" aria-pressed="true" onclick="setLang(&#39;en&#39;)" class="font-footnote text-footnote-semibold px-md py-xs rounded-art bg-light-surface dark:bg-dark-surface text-light-on-surface dark:text-dark-on-surface shadow-sm">
            <span data-design-text-token="footnote-semibold">EN</span>
          </button>
          <button type="button" id="btn-fr" aria-pressed="false" onclick="setLang(&#39;fr&#39;)" class="font-footnote text-footnote-semibold px-md py-xs rounded-art text-light-on-surface-variant dark:text-dark-on-surface-variant">
            <span data-design-text-token="footnote-semibold">FR</span>
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-2xl w-full mx-auto px-lg flex-1 flex flex-col">

      <h1 data-i="title" data-design-text-token="large-title-mobile" class="font-large text-large-title-mobile md:text-large-title text-light-on-surface dark:text-dark-on-surface pt-xs">
        Top 50
      </h1>
      <div class="flex items-center justify-between gap-sm mb-2xl">
        <span data-i="week" data-design-text-token="subhead" class="font-subhead text-subhead text-light-on-surface-variant dark:text-dark-on-surface-variant">Week of 16 Nov 2026</span>
        <button type="button" data-i="share" data-design-text-token="subhead-semibold" class="font-subhead text-subhead-semibold text-light-accent dark:text-dark-accent">Share</button>
      </div>

      <!-- Column Header -->
      <div class="flex items-baseline justify-between px-lg pb-1.5">
        <span data-i="colLeft" data-design-text-token="footnote" class="font-footnote text-footnote uppercase text-light-on-surface-variant dark:text-dark-on-surface-variant">Overall · 1–50</span>
        <span data-i="colRight" data-design-text-token="footnote" class="font-footnote text-footnote uppercase text-light-on-surface-variant dark:text-dark-on-surface-variant">LW · Peak · Wks</span>
      </div>

      <!-- Top 50 Grouped List (First 15 shown + Load more) -->
      <ol id="full-list" class="bg-light-surface dark:bg-dark-surface rounded-list overflow-hidden mb-lg divide-y divide-light-outline-variant dark:divide-dark-outline-variant">
      </ol>

      <button id="load-more-btn" onclick="showAllRows()" data-component-id="button-secondary" data-component-type="button" data-component-variant="secondary" type="button" class="w-full h-row-min text-light-accent dark:text-dark-accent font-body text-body mb-section inline-flex items-center justify-center">
        <span data-i="more" data-design-text-token="body">Show Ranks 16–50</span>
      </button>

      <footer class="px-lg flex flex-col gap-sm text-light-outline dark:text-dark-outline font-footnote text-footnote">
        <p data-i="foot" data-design-text-token="footnote">
          Cameroonian music, global audience. Ranked by code from YouTube and Audiomack activity, updated Mondays at 10:00 WAT.
        </p>
      </footer>

    </main>

    <!-- Floating Bottom Tab Bar -->
    <nav aria-label="Primary navigation" class="fixed bottom-0 inset-x-0 z-20 border-t border-light-outline-variant dark:border-dark-outline-variant bg-light-surface/75 dark:bg-dark-surface/75 backdrop-blur-xl">
      <div class="max-w-2xl mx-auto px-lg h-14 grid grid-cols-4 items-center">
        <a href="#charts" aria-current="page" class="flex flex-col items-center gap-0.5 text-light-accent dark:text-dark-accent">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M5 20V10M10 20V4M15 20v-8M20 20v-5"></path></svg>
          <span data-i="t1" data-design-text-token="tab-label" class="font-tab text-tab-label">Charts</span>
        </a>
        <a href="#search" class="flex flex-col items-center gap-0.5 text-light-on-surface-variant dark:text-dark-on-surface-variant">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg>
          <span data-i="t2" data-design-text-token="tab-label" class="font-tab text-tab-label">Search</span>
        </a>
        <a href="#archive" class="flex flex-col items-center gap-0.5 text-light-on-surface-variant dark:text-dark-on-surface-variant">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>
          <span data-i="t3" data-design-text-token="tab-label" class="font-tab text-tab-label">Archive</span>
        </a>
        <a href="#embed" class="flex flex-col items-center gap-0.5 text-light-on-surface-variant dark:text-dark-on-surface-variant">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="m8.5 8-4 4 4 4M15.5 8l4 4-4 4"></path></svg>
          <span data-i="t4" data-design-text-token="tab-label" class="font-tab text-tab-label">Embed</span>
        </a>
      </div>
    </nav>

  </div>

  <script>
    const rows = [
      [1, "Mboko Anthem", "Kora Nyambe ft. Tenzo", "up", 2, 3, 1, 6, "art-1"],
      [2, "Douala Nights", "Lino Essomba", "down", 1, 1, 1, 9, "art-2"],
      [3, "Bastos Flow", "MC Ngoa", "new", 0, "—", 3, 1, "art-3"],
      [4, "Sanza Ya Motema", "Belle Ayuk", "up", 3, 7, 2, 4, "art-4"],
      [5, "Kribi Sunset", "Sali Mbarga", "same", 0, 5, 4, 8, "art-5"],
      [6, "Mvet Pulse", "Dame Owona", "up", 4, 10, 6, 3, "art-6"],
      [7, "Wouri Grace", "Rine Tabi", "down", 2, 5, 3, 7, "art-7"],
      [8, "Ndamba Street", "Stan Akwa", "re", 0, "—", 5, 11, "art-8"],
      [9, "Mboa Sunrise", "Charly Dikoum", "down", 3, 6, 2, 12, "art-9"],
      [10, "Nkap Assiko", "Kris Nouma", "up", 1, 11, 10, 2, "art-10"],
      [11, "Bonanjo Rain", "Yvan Eboa", "up", 5, 16, 11, 4, "art-1"],
      [12, "Limbe Coast", "Nadia Tanyi", "down", 4, 8, 6, 5, "art-4"],
      [13, "Yaoundé Midnight", "Tobi Mefire", "same", 0, 13, 9, 7, "art-2"],
      [14, "Bafoussam Road", "Brice Kamga", "new", 0, "—", 14, 1, "art-6"],
      [15, "Sanaga Drift", "Amina Bello", "up", 2, 17, 12, 6, "art-5"]
    ];

    function mvHtml(kind, n) {
      if (kind === "up") return `<span data-design-text-token="footnote-semibold" class="font-footnote text-footnote-semibold text-light-up dark:text-dark-up">▲ ${n}</span>`;
      if (kind === "down") return `<span data-design-text-token="footnote-semibold" class="font-footnote text-footnote-semibold text-light-down dark:text-dark-down">▼ ${n}</span>`;
      if (kind === "new") return `<span data-design-text-token="footnote-semibold" class="font-footnote text-footnote-semibold text-light-accent dark:text-dark-accent">NEW</span>`;
      if (kind === "re") return `<span data-design-text-token="footnote-semibold" class="font-footnote text-footnote-semibold text-light-accent dark:text-dark-accent">RE</span>`;
      return `<span data-design-text-token="footnote-semibold" class="font-footnote text-footnote-semibold text-light-outline dark:text-dark-outline">—</span>`;
    }

    function renderRows(list) {
      document.getElementById("full-list").innerHTML = list.map(r => `
        <li class="flex items-center gap-md px-lg min-h-15 py-2.5 hover:bg-light-surface-container dark:hover:bg-dark-surface-container-high cursor-pointer">
          <div class="w-7 flex flex-col items-center shrink-0">
            <span data-design-text-token="headline" class="font-headline text-headline ${r[0] === 1 ? 'text-light-accent dark:text-dark-accent' : 'text-light-on-surface dark:text-dark-on-surface'}">${r[0]}</span>
            ${mvHtml(r[3], r[4])}
          </div>
          <div class="${r[8]} shrink-0 rounded-art" style="width:44px;height:44px;"></div>
          <div class="flex-1 min-w-0 flex items-center justify-between gap-sm">
            <div class="min-w-0">
              <div data-design-text-token="body" class="font-body text-body text-light-on-surface dark:text-dark-on-surface truncate">${r[1]}</div>
              <div data-design-text-token="subhead" class="font-subhead text-subhead text-light-on-surface-variant dark:text-dark-on-surface-variant truncate">${r[2]}</div>
            </div>
            <div data-design-text-token="footnote" class="font-footnote text-footnote text-light-outline dark:text-dark-outline shrink-0 text-right">
              ${r[5]} · ${r[6]} · ${r[7]}w
            </div>
          </div>
        </li>
      `).join("");
    }

    renderRows(rows);

    function showAllRows() {
      const extra = [];
      for (let i = 16; i <= 50; i++) {
        extra.push([i, `Chart Entry #${i}`, "Cameroon Artist", i % 3 === 0 ? "up" : "down", 1, i + 1, Math.max(10, i - 4), (i % 8) + 1, `art-${(i % 10) + 1}`]);
      }
      renderRows(rows.concat(extra));
      document.getElementById("load-more-btn").style.display = "none";
    }

    const copy = {
      en: { title: "Top 50", week: "Week of 16 Nov 2026", share: "Share", colLeft: "Overall · 1–50", colRight: "LW · Peak · Wks", more: "Show Ranks 16–50", foot: "Cameroonian music, global audience. Ranked by code from YouTube and Audiomack activity, updated Mondays at 10:00 WAT.", t1: "Charts", t2: "Search", t3: "Archive", t4: "Embed" },
      fr: { title: "Top 50", week: "Semaine du 16 nov. 2026", share: "Partager", colLeft: "Général · 1–50", colRight: "SD · Pic · Sem", more: "Afficher les rangs 16–50", foot: "Musique camerounaise, audience mondiale. Classement calculé à partir de l'activité YouTube et Audiomack, mis à jour le lundi à 10 h WAT.", t1: "Classements", t2: "Recherche", t3: "Archives", t4: "Intégrer" }
    };

    function setLang(lang) {
      document.documentElement.lang = lang;
      const c = copy[lang];
      document.querySelectorAll("[data-i]").forEach(el => {
        const k = el.getAttribute("data-i");
        if (c[k]) el.textContent = c[k];
      });
      const en = document.getElementById("btn-en");
      const fr = document.getElementById("btn-fr");
      const activeCls = "font-footnote text-footnote-semibold px-md py-xs rounded-art bg-light-surface dark:bg-dark-surface text-light-on-surface dark:text-dark-on-surface shadow-sm";
      const idleCls = "font-footnote text-footnote-semibold px-md py-xs rounded-art text-light-on-surface-variant dark:text-dark-on-surface-variant";
      en.setAttribute("aria-pressed", lang === "en");
      fr.setAttribute("aria-pressed", lang === "fr");
      en.className = lang === "en" ? activeCls : idleCls;
      fr.className = lang === "fr" ? activeCls : idleCls;
    }
  </script>


</body></html>
