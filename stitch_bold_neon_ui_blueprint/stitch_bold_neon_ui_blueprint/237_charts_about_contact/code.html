        'dark-surface-container': '#1C1C1E',
        'dark-surface-container-high': '#2C2C2E',
        'dark-on-surface-variant': '#AEAEB2',
        'dark-outline': '#636366',
        'dark-outline-variant': '#38383A',
        'dark-accent': '#FF8A1F',
        'dark-up': '#30D158',

        'lg': '16px',

      fontFamily: {
        'large': ['"Inter"', 'sans-serif'],
        'title': ['"Inter"', 'sans-serif'],

        'subhead': ['"Inter"', 'sans-serif'],
        'footnote': ['"Inter"', 'sans-serif'],

      },

        'large-title': ['34px', { lineHeight: '41px', letterSpacing: '0.37px', fontWeight: '700' }],
        'large-title-mobile': ['30px', { lineHeight: '36px', letterSpacing: '0.25px', fontWeight: '700' }],
        'title-2': ['22px', { lineHeight: '28px', letterSpacing: '0.35px', fontWeight: '700' }],
        'headline': ['17px', { lineHeight: '22px', letterSpacing: '-0.41px', fontWeight: '600' }],
        'body': ['17px', { lineHeight: '22px', letterSpacing: '-0.41px', fontWeight: '400' }],
        'subhead': ['15px', { lineHeight: '20px', letterSpacing: '-0.24px', fontWeight: '400' }],
        'subhead-semibold': ['15px', { lineHeight: '20px', letterSpacing: '-0.24px', fontWeight: '600' }],
        'footnote': ['13px', { lineHeight: '18px', letterSpacing: '-0.08px', fontWeight: '400' }],
        'footnote-semibold': ['13px', { lineHeight: '18px', letterSpacing: '-0.08px', fontWeight: '600' }],
        'caption': ['12px', { lineHeight: '16px', letterSpacing: '0px', fontWeight: '400' }],

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet">
  <style>
    html, body { font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body class="bg-light-background dark:bg-dark-background text-light-on-surface dark:text-dark-on-surface font-body">

  <div class="min-h-[884px] flex flex-col bg-light-background dark:bg-dark-background text-light-on-surface dark:text-dark-on-surface pb-24" data-stitch-vh="min-h-[884px]===min-h-screen">

    <header class="sticky top-0 z-10 bg-light-background/80 dark:bg-dark-background/80 backdrop-blur-xl">
      <div class="max-w-2xl mx-auto px-lg h-11 flex items-center justify-between">
        <a href="#more" class="inline-flex items-center gap-xs text-light-accent dark:text-dark-accent font-body text-body">
          <svg class="w-3 h-5" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2 2 10l8 8"></path></svg>
          <span data-design-text-token="body">More</span>
        </a>
      </div>
    </header>

    <main class="max-w-2xl w-full mx-auto px-lg flex-1 flex flex-col pt-xs">

      <h1 data-design-text-token="large-title-mobile" class="font-large text-large-title-mobile md:text-large-title text-light-on-surface dark:text-dark-on-surface">
        About &amp; Contact
      </h1>
      <p data-design-text-token="subhead" class="font-subhead text-subhead text-light-on-surface-variant dark:text-dark-on-surface-variant mb-2xl">
        Independent weekly chart for Cameroonian music.
      </p>

      <!-- Press & General -->
      <div class="px-lg pb-1.5">
        <span data-design-text-token="footnote" class="font-footnote text-footnote uppercase text-light-on-surface-variant dark:text-dark-on-surface-variant">Press &amp; Inquiries</span>
      </div>
      <ul class="bg-light-surface dark:bg-dark-surface rounded-list overflow-hidden mb-section divide-y divide-light-outline-variant dark:divide-dark-outline-variant">
        <li class="px-lg min-h-row-min py-3 flex items-center justify-between">
          <span data-design-text-token="body" class="font-body text-body text-light-on-surface dark:text-dark-on-surface">Press desk</span>
          <a href="mailto:press@237charts.com" data-design-text-token="subhead" class="font-subhead text-subhead text-light-accent dark:text-dark-accent">press@237charts.com</a>
        </li>
        <li class="px-lg min-h-row-min py-3 flex items-center justify-between">
          <span data-design-text-token="body" class="font-body text-body text-light-on-surface dark:text-dark-on-surface">Artist corrections</span>
          <a href="mailto:registry@237charts.com" data-design-text-token="subhead" class="font-subhead text-subhead text-light-accent dark:text-dark-accent">registry@237charts.com</a>
        </li>
      </ul>

      <!-- Artist Correction Form -->
      <div class="px-lg pb-1.5">
        <span data-design-text-token="footnote" class="font-footnote text-footnote uppercase text-light-on-surface-variant dark:text-dark-on-surface-variant">Request a Correction</span>
      </div>
      <form onsubmit="event.preventDefault(); document.getElementById(&#39;sent-msg&#39;).classList.remove(&#39;hidden&#39;);" class="bg-light-surface dark:bg-dark-surface rounded-list p-lg mb-section flex flex-col gap-md">
        <div class="flex flex-col gap-xs">
          <label for="artist-name" data-design-text-token="footnote" class="font-footnote text-footnote text-light-on-surface-variant dark:text-dark-on-surface-variant">Artist or Label Name</label>
          <input id="artist-name" type="text" placeholder="e.g. Kora Nyambe" class="w-full h-row-min px-md rounded-art bg-light-surface-container-high dark:bg-dark-surface-container-high text-light-on-surface dark:text-dark-on-surface border-0 font-body text-body">
        </div>
        <div class="flex flex-col gap-xs">
          <label for="channel-url" data-design-text-token="footnote" class="font-footnote text-footnote text-light-on-surface-variant dark:text-dark-on-surface-variant">Official YouTube / Audiomack Link</label>
          <input id="channel-url" type="url" placeholder="https://youtube.com/@..." class="w-full h-row-min px-md rounded-art bg-light-surface-container-high dark:bg-dark-surface-container-high text-light-on-surface dark:text-dark-on-surface border-0 font-body text-body">
        </div>
        <div class="flex flex-col gap-xs">
          <label for="note" data-design-text-token="footnote" class="font-footnote text-footnote text-light-on-surface-variant dark:text-dark-on-surface-variant">What needs correcting?</label>
          <textarea id="note" rows="3" placeholder="Wrong genre tag, missing official channel, or spelling." class="w-full p-md rounded-art bg-light-surface-container-high dark:bg-dark-surface-container-high text-light-on-surface dark:text-dark-on-surface border-0 font-body text-body"></textarea>
        </div>
        <button type="submit" class="w-full h-12 rounded-cta bg-light-accent dark:bg-dark-accent text-light-surface font-headline text-headline inline-flex items-center justify-center">
          <span data-design-text-token="headline">Send Request</span>
        </button>
        <p id="sent-msg" class="hidden font-footnote text-footnote text-light-up dark:text-dark-up text-center">Received. Every approved change is logged publicly on Methodology.</p>
      </form>

    </main>

    <!-- Floating Bottom Tab Bar -->
    <nav aria-label="Primary navigation" class="fixed bottom-0 inset-x-0 z-20 border-t border-light-outline-variant dark:border-dark-outline-variant bg-light-surface/75 dark:bg-dark-surface/75 backdrop-blur-xl">
      <div class="max-w-2xl mx-auto px-lg h-14 grid grid-cols-4 items-center">
        <a href="#charts" class="flex flex-col items-center gap-0.5 text-light-on-surface-variant dark:text-dark-on-surface-variant">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M5 20V10M10 20V4M15 20v-8M20 20v-5"></path></svg>
          <span data-design-text-token="tab-label" class="font-tab text-tab-label">Charts</span>
        </a>
        <a href="#search" class="flex flex-col items-center gap-0.5 text-light-on-surface-variant dark:text-dark-on-surface-variant">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg>
          <span data-design-text-token="tab-label" class="font-tab text-tab-label">Search</span>
        </a>
        <a href="#archive" class="flex flex-col items-center gap-0.5 text-light-on-surface-variant dark:text-dark-on-surface-variant">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>
          <span data-design-text-token="tab-label" class="font-tab text-tab-label">Archive</span>
        </a>
        <a href="#more" aria-current="page" class="flex flex-col items-center gap-0.5 text-light-accent dark:text-dark-accent">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg>
          <span data-design-text-token="tab-label" class="font-tab text-tab-label">More</span>
        </a>
      </div>
    </nav>

  </div>


</body></html>
