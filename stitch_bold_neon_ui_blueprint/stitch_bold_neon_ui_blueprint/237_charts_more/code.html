  <script>
    function saveLang(lang) {
      try { localStorage.setItem("237charts_lang", lang); } catch (e) {}
      const en = document.getElementById("m-en");
      const fr = document.getElementById("m-fr");
      const active = "font-footnote text-footnote-semibold px-md py-xs rounded-art bg-light-surface dark:bg-dark-surface text-light-on-surface dark:text-dark-on-surface shadow-sm";
      const idle = "font-footnote text-footnote-semibold px-md py-xs rounded-art text-light-on-surface-variant dark:text-dark-on-surface-variant";
      en.className = lang === "en" ? active : idle;
      fr.className = lang === "fr" ? active : idle;
    }

    function setTheme(mode) {
      document.documentElement.classList.toggle("dark", mode === "dark");
      try { localStorage.setItem("237charts_theme", mode); } catch (e) {}
      const lt = document.getElementById("t-light");
      const dk = document.getElementById("t-dark");
      const active = "font-footnote text-footnote-semibold px-md py-xs rounded-art bg-light-surface dark:bg-dark-surface text-light-on-surface dark:text-dark-on-surface shadow-sm";
      const idle = "font-footnote text-footnote-semibold px-md py-xs rounded-art text-light-on-surface-variant dark:text-dark-on-surface-variant";
      lt.className = mode === "light" ? active : idle;
      dk.className = mode === "dark" ? active : idle;
    }
  </script>
