  <script id="tailwind-config">/** @type {import('tailwindcss').Config} */

        'light-up': '#157F35',
        'light-down': '#C81E1E',
        'dark-background': '#000000',
        'dark-on-background': '#FFFFFF',
        'dark-surface': '#1C1C1E',
        'dark-on-surface': '#FFFFFF',
        'dark-surface-container': '#1C1C1E',
        'dark-surface-container-high': '#2C2C2E',
        'dark-on-surface-variant': '#AEAEB2',
        'dark-outline': '#636366',
        'dark-outline-variant': '#38383A',
        'dark-accent': '#FF8A1F',
        'dark-up': '#30D158',
        'dark-down': '#FF453A',
      },

        'list': '10px',

        'lg': '16px',

        'large': ['"Inter"', 'sans-serif'],

        'headline': ['"Inter"', 'sans-serif'],
        'body': ['"Inter"', 'sans-serif'],
        'subhead': ['"Inter"', 'sans-serif'],
        'footnote': ['"Inter"', 'sans-serif'],
        'caption': ['"Inter"', 'sans-serif'],
        'tab': ['"Inter"', 'sans-serif'],
      },
      fontSize: {
        'large-title': ['34px', { lineHeight: '41px', letterSpacing: '0.37px', fontWeight: '700' }],
        'large-title-mobile': ['30px', { lineHeight: '36px', letterSpacing: '0.25px', fontWeight: '700' }],
        'title-2': ['22px', { lineHeight: '28px', letterSpacing: '0.35px', fontWeight: '700' }],
        'headline': ['17px', { lineHeight: '22px', letterSpacing: '-0.41px', fontWeight: '600' }],
        'body': ['17px', { lineHeight: '22px', letterSpacing: '-0.41px', fontWeight: '400' }],
        'subhead': ['15px', { lineHeight: '20px', letterSpacing: '-0.24px', fontWeight: '400' }],
        'subhead-semibold': ['15px', { lineHeight: '20px', letterSpacing: '-0.24px', fontWeight: '600' }],
        'footnote': ['13px', { lineHeight: '18px', letterSpacing: '-0.08px', fontWeight: '400' }],
        'footnote-semibold': ['13px', { lineHeight: '18px', letterSpacing: '-0.08px', fontWeight: '600' }],
        'caption': ['12px', { lineHeight: '16px', letterSpacing: '0px', fontWeight: '400' }],
        'tab-label': ['10px', { lineHeight: '12px', letterSpacing: '0.1px', fontWeight: '500' }],
      },
      transitionDuration: {
        'spring': '250ms',
        'release': '200ms',
      },
      transitionDelay: {
        'spring': '0ms',
        'release': '0ms',
      },
      transitionTimingFunction: {
        'spring': 'cubic-bezier(0.25, 0.1, 0.25, 1)',
        'release': 'cubic-bezier(0.25, 0.1, 0.25, 1)',
      },
    },
  },
};
if (typeof module !== 'undefined') module.exports = globalThis.tailwind.config;
</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet">
  <style>
    html, body { font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
    .art-1 { background: linear-gradient(135deg, #FF9F43, #EE5A24); }
    .art-2 { background: linear-gradient(135deg, #5F27CD, #341F97); }
    .art-3 { background: linear-gradient(135deg, #10AC84, #01695A); }
    .art-4 { background: linear-gradient(135deg, #FF6B81, #C44569); }
    .art-5 { background: linear-gradient(135deg, #48DBFB, #0A79DF); }
  </style>
</head>
<body class="bg-light-background dark:bg-dark-background text-light-on-surface dark:text-dark-on-surface font-body">

  <div class="min-h-[884px] flex flex-col bg-light-background dark:bg-dark-background text-light-on-surface dark:text-dark-on-surface pb-24" data-stitch-vh="min-h-[884px]===min-h-screen">

    <!-- Sticky Navigation Bar -->
    <header class="sticky top-0 z-10 bg-light-background/80 dark:bg-dark-background/80 backdrop-blur-xl">
      <div class="max-w-2xl mx-auto px-lg h-11 flex items-center justify-between">
        <a href="#home" class="inline-flex items-center gap-xs text-light-accent dark:text-dark-accent font-body text-body">
          <svg class="w-3 h-5" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2 2 10l8 8"></path></svg>
          <span data-design-text-token="body">Charts</span>
        </a>
        <div class="inline-flex bg-light-surface-container-high dark:bg-dark-surface-container-high rounded-list p-0.5" role="group" aria-label="Language">
          <button type="button" aria-pressed="true" class="font-footnote text-footnote-semibold px-md py-xs rounded-art bg-light-surface dark:bg-dark-surface text-light-on-surface dark:text-dark-on-surface shadow-sm">
            <span data-design-text-token="footnote-semibold">EN</span>
          </button>
          <button type="button" aria-pressed="false" class="font-footnote text-footnote-semibold px-md py-xs rounded-art text-light-on-surface-variant dark:text-dark-on-surface-variant">
            <span data-design-text-token="footnote-semibold">FR</span>
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-2xl w-full mx-auto px-lg flex-1 flex flex-col">

      <h1 id="genre-heading" data-design-text-token="large-title-mobile" class="font-large text-large-title-mobile md:text-large-title text-light-on-surface dark:text-dark-on-surface pt-xs">
        Top 20 Makossa
      </h1>
      <p data-design-text-token="subhead" class="font-subhead text-subhead text-light-on-surface-variant dark:text-dark-on-surface-variant mb-lg">
        Week of 16 Nov 2026
      </p>

      <!-- Genre Switcher -->
      <div class="flex gap-sm overflow-x-auto pb-md mb-lg" role="tablist" aria-label="Genres">
        <button role="tab" aria-selected="false" onclick="switchGenre(&#39;Afropop&#39;, this)" class="genre-tab shrink-0 font-footnote text-footnote-semibold px-md py-sm rounded-list bg-light-surface dark:bg-dark-surface text-light-on-surface-variant dark:text-dark-on-surface-variant">Afropop</button>
        <button role="tab" aria-selected="false" onclick="switchGenre(&#39;Rap&#39;, this)" class="genre-tab shrink-0 font-footnote text-footnote-semibold px-md py-sm rounded-list bg-light-surface dark:bg-dark-surface text-light-on-surface-variant dark:text-dark-on-surface-variant">Rap</button>
        <button role="tab" aria-selected="true" onclick="switchGenre(&#39;Makossa&#39;, this)" class="genre-tab shrink-0 font-footnote text-footnote-semibold px-md py-sm rounded-list bg-light-accent dark:bg-dark-accent text-light-surface">Makossa</button>
        <button role="tab" aria-selected="false" onclick="switchGenre(&#39;Bikutsi&#39;, this)" class="genre-tab shrink-0 font-footnote text-footnote-semibold px-md py-sm rounded-list bg-light-surface dark:bg-dark-surface text-light-on-surface-variant dark:text-dark-on-surface-variant">Bikutsi</button>
        <button role="tab" aria-selected="false" onclick="switchGenre(&#39;R&amp;B / Zouk&#39;, this)" class="genre-tab shrink-0 font-footnote text-footnote-semibold px-md py-sm rounded-list bg-light-surface dark:bg-dark-surface text-light-on-surface-variant dark:text-dark-on-surface-variant">R&amp;B / Zouk</button>
        <button role="tab" aria-selected="false" onclick="switchGenre(&#39;Gospel&#39;, this)" class="genre-tab shrink-0 font-footnote text-footnote-semibold px-md py-sm rounded-list bg-light-surface dark:bg-dark-surface text-light-on-surface-variant dark:text-dark-on-surface-variant">Gospel</button>
        <button role="tab" aria-selected="false" onclick="switchGenre(&#39;Traditional&#39;, this)" class="genre-tab shrink-0 font-footnote text-footnote-semibold px-md py-sm rounded-list bg-light-surface dark:bg-dark-surface text-light-on-surface-variant dark:text-dark-on-surface-variant">Traditional</button>
      </div>

      <!-- Column Header -->
      <div class="flex items-baseline justify-between px-lg pb-1.5">
        <span data-design-text-token="footnote" class="font-footnote text-footnote uppercase text-light-on-surface-variant dark:text-dark-on-surface-variant">Top 20</span>
        <span data-design-text-token="footnote" class="font-footnote text-footnote uppercase text-light-on-surface-variant dark:text-dark-on-surface-variant">LW · Peak · Wks</span>
      </div>

      <!-- Genre Top 20 Grouped List -->
      <ol id="genre-rows" class="bg-light-surface dark:bg-dark-surface rounded-list overflow-hidden mb-section divide-y divide-light-outline-variant dark:divide-dark-outline-variant">
      </ol>

      <footer class="px-lg flex flex-col gap-sm text-light-outline dark:text-dark-outline font-footnote text-footnote">
        <p data-design-text-token="footnote">
          Cameroonian music, global audience. Ranked by code from YouTube and Audiomack activity.
        </p>
      </footer>

    </main>

    <!-- Floating Bottom Tab Bar -->
    <nav aria-label="Primary navigation" class="fixed bottom-0 inset-x-0 z-20 border-t border-light-outline-variant dark:border-dark-outline-variant bg-light-surface/75 dark:bg-dark-surface/75 backdrop-blur-xl">
      <div class="max-w-2xl mx-auto px-lg h-14 grid grid-cols-4 items-center">
        <a href="#charts" aria-current="page" class="flex flex-col items-center gap-0.5 text-light-accent dark:text-dark-accent">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M5 20V10M10 20V4M15 20v-8M20 20v-5"></path></svg>
          <span data-design-text-token="tab-label" class="font-tab text-tab-label">Charts</span>
        </a>
        <a href="#search" class="flex flex-col items-center gap-0.5 text-light-on-surface-variant dark:text-dark-on-surface-variant">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg>
          <span data-design-text-token="tab-label" class="font-tab text-tab-label">Search</span>
        </a>
        <a href="#archive" class="flex flex-col items-center gap-0.5 text-light-on-surface-variant dark:text-dark-on-surface-variant">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>
          <span data-design-text-token="tab-label" class="font-tab text-tab-label">Archive</span>
        </a>
        <a href="#embed" class="flex flex-col items-center gap-0.5 text-light-on-surface-variant dark:text-dark-on-surface-variant">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="m8.5 8-4 4 4 4M15.5 8l4 4-4 4"></path></svg>
          <span data-design-text-token="tab-label" class="font-tab text-tab-label">Embed</span>
        </a>
      </div>
    </nav>

  </div>

  <script>
    const makossa = [
      [1, "Douala Nights", "Lino Essomba", "same", 0, 1, 1, 9, "art-2"],
      [2, "Bonapriso Breeze", "Charly Dikoum", "up", 2, 4, 2, 5, "art-4"],
      [3, "Wouri Tide", "Yvan Eboa", "up", 1, 4, 3, 4, "art-1"],
      [4, "Akwa Dance", "Nadia Tanyi", "down", 2, 2, 2, 7, "art-3", true],
      [5, "Deido Groove", "Sali Mbarga", "new", 0, "—", 5, 1, "art-5"],
      [6, "New Bell Echo", "Kris Nouma", "up", 3, 9, 6, 3, "art-2"],
      [7, "Makepe Lights", "Belle Ayuk", "down", 1, 6, 4, 6, "art-4"],
      [8, "Kribi Harbor", "Stan Akwa", "same", 0, 8, 5, 8, "art-1"],
      [9, "Bessengue Beat", "Dame Owona", "re", 0, "—", 7, 10, "art-3"],
      [10, "Ndokoti Jam", "Tobi Mefire", "down", 3, 7, 6, 4, "art-5"]
    ];

    function mvHtml(kind, n) {
      if (kind === "up") return `<span data-design-text-token="footnote-semibold" class="font-footnote text-footnote-semibold text-light-up dark:text-dark-up">▲ ${n}</span>`;
      if (kind === "down") return `<span data-design-text-token="footnote-semibold" class="font-footnote text-footnote-semibold text-light-down dark:text-dark-down">▼ ${n}</span>`;
      if (kind === "new") return `<span data-design-text-token="footnote-semibold" class="font-footnote text-footnote-semibold text-light-accent dark:text-dark-accent">NEW</span>`;
      if (kind === "re") return `<span data-design-text-token="footnote-semibold" class="font-footnote text-footnote-semibold text-light-accent dark:text-dark-accent">RE</span>`;
      return `<span data-design-text-token="footnote-semibold" class="font-footnote text-footnote-semibold text-light-outline dark:text-dark-outline">—</span>`;
    }

    function renderGenre(rows) {
      document.getElementById("genre-rows").innerHTML = rows.map(r => `
        <li class="flex items-center gap-md px-lg min-h-15 py-2.5 hover:bg-light-surface-container dark:hover:bg-dark-surface-container-high cursor-pointer">
          <div class="w-7 flex flex-col items-center shrink-0">
            <span data-design-text-token="headline" class="font-headline text-headline ${r[0] === 1 ? 'text-light-accent dark:text-dark-accent' : 'text-light-on-surface dark:text-dark-on-surface'}">${r[0]}</span>
            ${mvHtml(r[3], r[4])}
          </div>
          <div class="${r[8]} shrink-0 rounded-art" style="width:44px;height:44px;"></div>
          <div class="flex-1 min-w-0 flex items-center justify-between gap-sm">
            <div class="min-w-0">
              <div data-design-text-token="body" class="font-body text-body text-light-on-surface dark:text-dark-on-surface truncate">${r[1]}</div>
              <div data-design-text-token="subhead" class="font-subhead text-subhead text-light-on-surface-variant dark:text-dark-on-surface-variant truncate">${r[2]}</div>
              ${r[9] ? `<div data-design-text-token="footnote" class="font-footnote text-footnote text-light-accent dark:text-dark-accent">Adjusted for irregular activity</div>` : ''}
            </div>
            <div data-design-text-token="footnote" class="font-footnote text-footnote text-light-outline dark:text-dark-outline shrink-0 text-right">
              ${r[5]} · ${r[6]} · ${r[7]}w
            </div>
          </div>
        </li>
      `).join("");
    }

    renderGenre(makossa);

    function switchGenre(name, btn) {
      document.getElementById("genre-heading").textContent = "Top 20 " + name;
      document.querySelectorAll(".genre-tab").forEach(b => {
        b.setAttribute("aria-selected", b === btn);
        b.className = b === btn
          ? "genre-tab shrink-0 font-footnote text-footnote-semibold px-md py-sm rounded-list bg-light-accent dark:bg-dark-accent text-light-surface"
          : "genre-tab shrink-0 font-footnote text-footnote-semibold px-md py-sm rounded-list bg-light-surface dark:bg-dark-surface text-light-on-surface-variant dark:text-dark-on-surface-variant";
      });
    }
  </script>


</body></html>
